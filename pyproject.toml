[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tron-python"
version = "0.1.0"
description = "Python SDK for the TRON (Token Reduced Object Notation) format — compact, LLM-friendly JSON superset"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["tron", "llm", "token", "json", "serialization", "ai"]
authors = [{ name = "tron-python contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []  # zero runtime deps — stdlib only

[project.optional-dependencies]
benchmark = ["tiktoken>=0.5"]
pydantic = ["pydantic>=1.10"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
    "pydantic>=2.0",
]

[project.urls]
Homepage        = "https://github.com/tron-format/tron-python"
Repository      = "https://github.com/tron-format/tron-python"
"Bug Tracker"   = "https://github.com/tron-format/tron-python/issues"
Specification   = "https://tron-format.github.io/"
Changelog       = "https://github.com/tron-format/tron-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tron"]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore  = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["tron"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
files = ["src"]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_ignores = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source  = ["src/tron"]
branch  = true

[tool.coverage.report]
show_missing   = true
skip_covered   = false
fail_under     = 88
